importer.scanned-bucket=${SCANNED_BUCKET}
importer.region=${AWS_REGION}
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=840
spring.datasource.hikari.data-source-properties.options=-c timezone=UTC -c statement_timeout=780000 -c lock_timeout=10000
spring.jpa.open-in-view=false
spring.liquibase.enabled=false
spring.main.banner-mode=off
importer.sweep-limit=${IMPORTER_SWEEP_LIMIT:20}
