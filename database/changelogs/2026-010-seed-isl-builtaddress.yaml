# Jira: ALS-13
# Description: Seed local ISL built addresses
# Author: team-atlas
# Created: 2026-10-12
databaseChangeLog:
  - changeSet:
      id: "2026-010:01"
      author: team-atlas
      context: "@local"
      comment: Load ISL built-address fixtures into the disposable local database.
      preConditions:
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT count(*) FROM os_data.add_isl_builtaddress_v3
      changes:
        - loadData:
            file: ../test-data/isl_builtaddress.csv
            relativeToChangelogFile: true
            schemaName: os_data
            tableName: add_isl_builtaddress_v3
            separator: ","
            quotchar: '"'
            nullPlaceholder: "NULL"
            usePreparedStatements: false
      rollback:
        - delete:
            schemaName: os_data
            tableName: add_isl_builtaddress_v3
