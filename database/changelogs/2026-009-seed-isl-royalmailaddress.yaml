# Jira: ALS-13
# Description: Seed local ISL Royal Mail addresses
# Author: team-atlas
# Created: 2026-10-12
databaseChangeLog:
  - changeSet:
      id: "2026-009:01"
      author: team-atlas
      context: "@local"
      comment: Load ISL Royal Mail fixtures into the disposable local database.
      preConditions:
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT count(*) FROM os_data.add_isl_royalmailaddress_v1
      changes:
        - loadData:
            file: ../test-data/isl_royalmailaddress.csv
            relativeToChangelogFile: true
            schemaName: os_data
            tableName: add_isl_royalmailaddress_v1
            separator: ","
            quotchar: '"'
            nullPlaceholder: "NULL"
            usePreparedStatements: false
      rollback:
        - delete:
            schemaName: os_data
            tableName: add_isl_royalmailaddress_v1
