server.port=${SERVER_PORT:8080}
management.endpoints.enabled-by-default=false
management.endpoints.web.base-path=/address-lookup-api/
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=never
management.endpoint.health.enabled=true
api.api-local-url=${API_LOCAL_URL:localhost}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# The service never migrates its own database. Aurora is changed only by the
# schema-migrator Lambda from a released db-schema artefact (see db-schema/README.md).
spring.liquibase.enabled=false
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}