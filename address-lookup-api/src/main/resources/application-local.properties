spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/address_lookup}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations,classpath:db/local
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
# spring-boot:run uses the module directory as working directory; compose.yaml lives in the repo root
spring.docker.compose.file=${DOCKER_COMPOSE_FILE:../compose.yaml}
